name: gusto_neumorphic
description: A complete, ready to use, Neumorphic ui kit for Flutter. Dark theming compatible & fully customizable.
version: 4.0.0
#authors: [
#  Florent Champigny <champigny.florent@gmail.com>,
#  Olivier Bonvila <olivier.bonvila@idean.com>,
#  Gyl Jean Lambert <almighty972@gmail.com>
#]
homepage: https://github.com/gustomedialab/Flutter-Neumorphic
issue_tracker: https://github.com/gustomedialab/Flutter-Neumorphic/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
   - family: NeumorphicIcons
     fonts:
      - asset: fonts/NeumorphicIcons.ttf